[project]
name = "iquana-toolbox"
version = "0.1.0"
description = "This repository contains common functionality in the IQUANA tool. It defines pydantic schemas, as well as common methods."
requires-python = ">=3.12"
dependencies = [
    "cachetools>=6.2.6",
    "mlflow>=3.10.1",
    "numpy",
    "opencv-python",
    "pycocotools",
    "pydantic",
    "scipy",
    "scipy-stubs",
    "torch>=2.12.1",
    "transformers>=5.12.1",
]
