[project]
name = "iquana-toolbox"
version = "0.1.0"
description = "This repository contains common functionality in the IQUANA tool. It defines pydantic schemas, as well as common methods."
requires-python = ">=3.12"
# Deliberately free of torch/transformers/torchvision. This package is installed
# by the backend, which does not run models directly, and a transitive torch drags
# the whole CUDA toolkit (~GBs) into every `uv sync`. The heavy in-process AI code
# (the DINOv3 backbone, the COCO dataloaders) therefore lives in ai-service under
# `models/`; only the abstract `ai.base_classes` interface and the MLflow registry stay here.
dependencies = [
    "cachetools>=6.2.6",
    "mlflow>=3.10.1",
    "numpy",
    "opencv-python",
    "pycocotools",
    "pydantic",
    "scipy",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Type stubs only -- no runtime import, so consumers must not inherit them.
    "scipy-stubs",
]

[tool.pytest.ini_options]
# The project is not installed into its own venv, so put src/ on the path for tests.
pythonpath = ["src"]
testpaths = ["tests"]
